spring.application.name=shop
server.port=8100
app.commit=unknown

# Database: H2 running as a separate server process, so the lab can take it down.
spring.datasource.url=jdbc:h2:tcp://localhost:9092/shop
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.leak-detection-threshold=5000
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.example.shop.web.QueryCounter

# Outside payment service
payment.base-url=http://127.0.0.1:8101
payment.timeout-ms=800

# Metrics at /actuator/prometheus
management.endpoints.web.exposure.include=health,prometheus

# JSON logs (Logstash format) to logs/app.log; plain text on the console
logging.file.name=logs/app.log
logging.structured.format.file=logstash
logging.logback.rollingpolicy.max-file-size=10MB
